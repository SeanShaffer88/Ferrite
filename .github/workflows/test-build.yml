# Unsigned test builds for trying out a branch before an official release.
# Usage: git tag test-v0.3.2-dev.1 && git push origin test-v0.3.2-dev.1
#
# Builds Windows, Linux and macOS binaries WITHOUT code signing (no SignPath
# secrets needed) and publishes them as a GitHub pre-release. Official
# releases still go through release.yml (tags `v*`).

name: Test Build

on:
  push:
    tags:
      - 'test-v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          mkdir release
          copy target\release\forgepad.exe release\
          Compress-Archive -Path release\* -DestinationPath forgepad-windows-x64-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: forgepad-windows-x64-unsigned.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir release
          cp target/release/forgepad release/
          tar -czvf forgepad-linux-x64.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: forgepad-linux-x64.tar.gz

  build-linux-arm64:
    name: Build Linux (arm64)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir release
          cp target/release/forgepad release/
          tar -czvf forgepad-linux-arm64.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: forgepad-linux-arm64.tar.gz

  build-macos:
    name: Build macOS (Apple Silicon, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build release
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir release
          cp target/release/forgepad release/
          tar -czvf forgepad-macos-arm64-unsigned.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: forgepad-macos-arm64-unsigned.tar.gz

  release:
    name: Publish pre-release
    needs: [build-windows, build-linux, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v1
        with:
          name: Forgepad ${{ github.ref_name }} (test build)
          prerelease: true
          draft: false
          body: |
            **Unsigned test build** of `${{ github.sha }}` for trying out unreleased changes.
            Not an official release. Windows SmartScreen and macOS Gatekeeper will warn
            because the binaries are not signed. Verify downloads against `SHA256SUMS.txt`
            (`sha256sum -c SHA256SUMS.txt`, or `Get-FileHash` in PowerShell).

            - Windows: unzip and run `forgepad.exe`.
            - Linux: `tar -xzf forgepad-linux-x64.tar.gz && ./forgepad` (arm64: `forgepad-linux-arm64.tar.gz`, glibc 2.35+)
            - macOS: `tar -xzf forgepad-macos-arm64-unsigned.tar.gz && xattr -d com.apple.quarantine forgepad && ./forgepad`
          files: dist/*
